<!doctype html><html lang=zh-cn><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>JSON 字符串转义/反转义 - muzimu</title><meta name=description content="在线 JSON 字符串转义与反转义工具"><link rel=stylesheet href=/css/jsonesc/styles.css></head><body><header><h1>JSON 字符串转义/反转义</h1><nav><a href=/tools/>← 返回</a></nav></header><main><div class=container><div class=toolbar><div class=mode-toggle><button id=btn-unescape class=active>反转义 (Unescape)</button>
<button id=btn-escape>转义 (Escape)</button></div><button id=btn-run>执行</button>
<button id=btn-copy>复制结果</button>
<button id=btn-clear>清空</button></div><div class=editors><div class=editor-pane><div class=editor-label>输入</div><textarea id=input placeholder='粘贴待处理的字符串，例如："{\"name\":\"张三\"}"'></textarea></div><div class=editor-pane><div class=editor-label>输出</div><textarea id=output readonly placeholder=结果将显示在这里...></textarea></div></div><div id=status class=status></div><div class=help><h3>使用说明</h3><ul><li>&lt;strong>反转义&lt;/strong>：将 JSON 转义字符串还原为原始文本，例如 &lt;code>"{\"name\":\"张三\"}"&lt;/code> → &lt;code>{"name":"张三"}&lt;/code></li><li>&lt;strong>转义&lt;/strong>：将文本转为 JSON 字符串，例如 &lt;code>{"name":"张三"}&lt;/code> → &lt;code>"{\"name\":\"张三\"}"&lt;/code></li><li>支持逐行逐行处理多行输入</li></ul></div></div></main><footer><p>基于 <a href=https://github.com/muzimu/jsonesc target=_blank>jsonesc</a> | 完全在浏览器中运行</p></footer><script src=/js/jsonesc/main.js></script></body></html>
